services:
  mysql:
    image: mysql:8.0
    container_name: importacionesq8_mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-importacionesq8}
      MYSQL_USER: ${MYSQL_USER:-usuario_q8}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password_q8}
    command: ["--max-connections=500", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    # Solo localhost: no exponer MySQL a la red (OWASP A05)
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: importacionesq8_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_q8_dev_change_me}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_q8_dev_change_me}", "ping"]
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: importacionesq8_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql/${MYSQL_DATABASE:-importacionesq8}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_q8_dev_change_me}@redis:6379/0
      APP_ENV: ${APP_ENV:-development}
      LOAD_TEST_AUTO_VERIFY: ${LOAD_TEST_AUTO_VERIFY:-false}
      # Capacidad objetivo: ~1000 usuarios concurrentes / ~100 ops simultáneas.
      # 4 workers × (pool 15 + overflow 30) ≈ 180 conexiones; MySQL max-connections=500.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-15}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-30}
      RATE_LIMIT_PUBLIC_READ: ${RATE_LIMIT_PUBLIC_READ:-120/minute}
      RATE_LIMIT_PUBLIC_WRITE: ${RATE_LIMIT_PUBLIC_WRITE:-30/minute}
      RATE_LIMIT_CHAT_MESSAGE: ${RATE_LIMIT_CHAT_MESSAGE:-60/minute}
      RATE_LIMIT_NOTIFICACIONES: ${RATE_LIMIT_NOTIFICACIONES:-90/minute}
      WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY:-pub_test_placeholder}
      WOMPI_SECRET_KEY: ${WOMPI_SECRET_KEY:-prv_test_placeholder}
      WOMPI_EVENTS_SECRET: ${WOMPI_EVENTS_SECRET:?WOMPI_EVENTS_SECRET must be set in .env}
      WOMPI_SIMULATE: ${WOMPI_SIMULATE:-true}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-5/minute}
      RATE_LIMIT_REGISTER: ${RATE_LIMIT_REGISTER:-10/minute}
      RATE_LIMIT_FORGOT_PASSWORD: ${RATE_LIMIT_FORGOT_PASSWORD:-5/minute}
    # Los archivos subidos y los PDF generados viven en el sistema de ficheros,
    # no en MySQL. Sin estos volúmenes se quedaban en la capa de escritura del
    # contenedor: cada `docker compose build backend` + recreación los borraba y
    # dejaba las filas de `archivos` apuntando a binarios inexistentes, con un
    # 404 "No hay contenido descargable" al abrirlos.
    volumes:
      - backend_uploads:/app/uploads
      - backend_generated_docs:/app/generated_docs
      # Carpeta del HOST, no un volumen: los backups tienen que sobrevivir a
      # `docker compose down -v`, que es justo cuando hacen falta. Ver
      # scripts/backup_servidor.sh y scripts/restaurar_servidor.sh.
      - ./backups:/app/backups
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: importacionesq8_frontend
    restart: unless-stopped
    environment:
      # Lo usa el BROWSER del usuario, que corre en el host: ahí `localhost:8000`
      # sí es el backend, porque su puerto está publicado.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000}
      # Lo usa el proceso de Vite DENTRO del contenedor para reenviar /api. Aquí
      # `localhost` sería el propio contenedor, así que va por el nombre del
      # servicio. Sin esto el proxy respondía 500 (relevante al exponer el front
      # por Dev Tunnel, donde el browser no alcanza localhost:8000).
      VITE_PROXY_TARGET: http://backend:8000
      # Recarga en caliente sobre el bind mount: sin sondeo, Vite no ve los
      # cambios que haces en tu editor del host.
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: importacionesq8_tests
    environment:
      DATABASE_URL: sqlite:////app/test.db
      SECRET_KEY: test-secret-key-not-for-production-use-only
      APP_ENV: test
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000
      WOMPI_EVENTS_SECRET: test_events_secret_for_ci
      WOMPI_SIMULATE: "true"
      RATE_LIMIT_LOGIN: 1000/minute
      RATE_LIMIT_REGISTER: 1000/minute
      RATE_LIMIT_FORGOT_PASSWORD: 1000/minute
      RATE_LIMIT_OTP: 1000/minute
    volumes:
      - ./test_data:/app/test_data

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  # Sobreviven a `docker compose down` y a reconstruir la imagen; solo
  # `docker compose down -v` los borra.
  backend_uploads:
    driver: local
  backend_generated_docs:
    driver: local
